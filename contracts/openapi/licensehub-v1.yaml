openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: LicenseHub API
  version: 1.0.0
  description: |
    Contrato draft, previo a implementación. HTTPS obligatorio.
    Integraciones autenticadas por credencial opaca de backend; aplicación derivada
    de la credencial, nunca del cuerpo. subjectId lo determina el backend consumidor.
    Todas las respuestas incluyen Cache-Control no-store. Fechas UTC RFC3339.
    Idempotencia transaccional con retención mínima de 30 días; replay de activación
    devuelve resultado original y no sirve como autorización actual.
    Admin requiere sesión Identity con MFA y permiso por aplicación; mutaciones
    requieren X-CSRF-TOKEN. Recursos ajenos se responden como 404.
servers:
  - url: https://licensehub.example.invalid
tags:
  - name: Integration
  - name: Administration
security:
  - IntegrationCredential: []
paths:
  /api/v1/licenses/activate:
    post:
      tags: [Integration]
      operationId: activateLicense
      description: |
        Scope licenses:activate. Un único canje por clave. Repetir la misma clave
        idempotente y solicitud devuelve el resultado original; otro intento de
        canje devuelve 409. Cliente preasignado debe coincidir con subjectId.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: Activación confirmada o replay original.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/licenses/status:
    get:
      tags: [Integration]
      operationId: getLicenseStatus
      description: Scope licenses:read. Sin licencia devuelve 200, license null y effectiveState None.
      parameters:
        - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Snapshot calculado al momento de consultar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/licenses/features:
    get:
      tags: [Integration]
      operationId: getLicenseFeatures
      description: |
        Scope licenses:read. Retorna el snapshot completo y solo features concedidas.
        Código ausente equivale a denegado. Aplicación o feature desactivada no concede derechos.
      parameters:
        - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Derechos efectivos; lista vacía si no hay Premium.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/licenses/warnings:
    get:
      tags: [Integration]
      operationId: getLicenseWarnings
      description: Scope warnings:read. Solo avisos del sujeto dentro de la aplicación autenticada.
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Orden estable por createdAt e id; cursor opaco ligado a aplicación, sujeto y filtros.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Warning' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/licenses:
    post:
      tags: [Administration]
      operationId: issueLicenses
      security: [{ AdminSession: [], CsrfToken: [] }]
      description: |
        Permiso licenses:issue. Devuelve códigos completos solo en la respuesta de creación.
        Un replay devuelve códigos null y codesRecoverable false; no se guardan secretos
        en idempotencia. Cantidad de 1 a 100, operación atómica.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueRequest' }
      responses:
        '201':
          description: Licencias emitidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueResponse' }
        '200':
          description: Replay sin códigos recuperables.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [Administration]
      operationId: listLicenses
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/LicenseState' }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Licencias sin códigos ni hashes.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/License' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/licenses/{id}/renew:
    post:
      tags: [Administration]
      operationId: renewLicense
      security: [{ AdminSession: [], CsrfToken: [] }]
      description: |
        Permiso licenses:renew; reactivate true requiere licenses:reactivate.
        operationId es único permanente por aplicación. Licencia debe estar canjeada.
        Pago indicado debe estar Confirmed, corresponder a la licencia y no haberse usado.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewalRequest' }
      responses:
        '200':
          description: Licencia renovada; replay se resuelve antes de comprobar If-Match otra vez.
          headers:
            ETag: { schema: { type: string }, description: Versión fuerte de la licencia. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/License' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/licenses/{id}/suspend:
    post:
      tags: [Administration]
      operationId: suspendLicense
      security: [{ AdminSession: [], CsrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StateChange' }
      responses:
        '200':
          description: Suspendida; derechos invalidados en servidor, caché SDK hasta 30 segundos.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/License' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/licenses/{id}/revoke:
    post:
      tags: [Administration]
      operationId: revokeLicense
      security: [{ AdminSession: [], CsrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StateChange' }
      responses:
        '200':
          description: Revocada, propagación de caché igual a suspensión.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/License' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/applications:
    get:
      tags: [Administration]
      operationId: listApplications
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Solo aplicaciones autorizadas.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/customers:
    get:
      tags: [Administration]
      operationId: listCustomers
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Clientes de aplicación autorizada.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/payments:
    get:
      tags: [Administration]
      operationId: listPayments
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Pagos de aplicación autorizada.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/audit-logs:
    get:
      tags: [Administration]
      operationId: listAuditLogs
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Auditoría de aplicación autorizada.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    IntegrationCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque-application-credential
      description: Secreto de backend con aplicación y scopes resueltos en servidor; no es JWT.
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-LicenseHub
      description: Sesión Identity MFA en producción, Secure HttpOnly SameSite Strict.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Antiforgery vinculado a sesión; obligatorio en mutaciones administrativas.
  parameters:
    SubjectId:
      name: subjectId
      in: query
      required: true
      schema: { $ref: '#/components/schemas/SubjectId' }
    ApplicationId:
      name: applicationId
      in: query
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por cliente; reutilizar solo para mismo comando. Retención mínima 30 días.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag fuerte de versión de licencia; lista administrativa incluye etag. No se acepta asterisco.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
      description: Cursor opaco validado, ligado a aplicación y filtros; orden createdAt,id descendente.
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    BadRequest:
      description: Solicitud inválida; validation_failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Credencial/sesión ausente, inválida, expirada o revocada; authentication_required.
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Scope insuficiente, aplicación desactivada, MFA incompleto o CSRF inválido; forbidden.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso no visible o clave no disponible; not_found o license_unavailable, sin revelar propietario.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: license_unavailable, invalid_transition, subject_already_licensed, payment_already_applied, operation_conflict, idempotency_conflict o idempotency_in_progress.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Solo para operación aún en curso. }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: Versión cambió; concurrency_conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: Falta If-Match; precondition_required.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Límite excedido; rate_limited.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Dependencia temporalmente indisponible; service_unavailable. No conceder derechos nuevos.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    SubjectId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      description: Identificador estable case-sensitive de negocio/cuenta en aplicación; determinado por backend confiable.
    LicenseState:
      type: string
      enum: [Pending, Active, Suspended, Expired, Revoked, Cancelled]
    Duration:
      type: object
      additionalProperties: false
      required: [unit, value]
      properties:
        unit: { type: string, enum: [Minute, Hour, Day, Month, Year] }
        value: { type: integer, minimum: 1, maximum: 1000000 }
      description: Mes/año calendario UTC con ajuste al último día válido. Rechazar overflow y fecha posterior a 9999-12-31.
    Term:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, duration]
          properties:
            kind: { const: Duration }
            duration: { $ref: '#/components/schemas/Duration' }
        - type: object
          additionalProperties: false
          required: [kind, until]
          properties:
            kind: { const: Until }
            until: { type: string, format: date-time, pattern: 'Z$' }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { const: Lifetime }
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [licenseKey, subjectId]
      properties:
        licenseKey: { type: string, pattern: '^LH1_[A-Za-z0-9_-]{43}$', writeOnly: true }
        subjectId: { $ref: '#/components/schemas/SubjectId' }
    ActivationResponse:
      type: object
      required: [activationId, activatedAt, snapshot]
      properties:
        activationId: { type: string, format: uuid }
        activatedAt: { type: string, format: date-time, pattern: 'Z$' }
        snapshot: { $ref: '#/components/schemas/EntitlementSnapshot' }
    EntitlementSnapshot:
      type: object
      required: [applicationId, subjectId, license, effectiveState, hasPremium, features, evaluatedAt, cacheUntil, entitlementVersion]
      properties:
        applicationId: { type: string, format: uuid }
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        license:
          oneOf:
            - $ref: '#/components/schemas/LicenseSummary'
            - type: 'null'
        effectiveState: { type: string, enum: [None, Pending, Active, Suspended, Expired, Revoked, Cancelled] }
        hasPremium: { type: boolean }
        features:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        evaluatedAt: { type: string, format: date-time, pattern: 'Z$' }
        cacheUntil: { type: string, format: date-time, pattern: 'Z$' }
        entitlementVersion: { type: string, pattern: '^[0-9]+$' }
      description: |
        hasPremium solo true cuando effectiveState Active. features vacías en otros estados.
        cacheUntil <= evaluatedAt+30s. Para Active finita también <= expiresAt.
        Un snapshot denegado puede cachearse 30s, demorando reconocimiento de renovación.
        Nunca stale al vencer caché.
        entitlementVersion string evita pérdida de precisión de bigint en TypeScript; 0 sin licencia.
    LicenseSummary:
      type: object
      required: [id, customerId, isLifetime, expiresAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        isLifetime: { type: boolean }
        expiresAt: { type: [string, 'null'], format: date-time, pattern: 'Z$' }
    License:
      type: object
      required: [id, applicationId, customerId, state, startMode, isLifetime, startsAt, activatedAt, expiresAt, features, createdAt, etag]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        customerId: { type: [string, 'null'], format: uuid }
        state: { $ref: '#/components/schemas/LicenseState' }
        startMode: { type: string, enum: [OnIssue, OnActivation] }
        isLifetime: { type: boolean }
        startsAt: { type: [string, 'null'], format: date-time, pattern: 'Z$' }
        activatedAt: { type: [string, 'null'], format: date-time, pattern: 'Z$' }
        expiresAt: { type: [string, 'null'], format: date-time, pattern: 'Z$' }
        features:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        createdAt: { type: string, format: date-time, pattern: 'Z$' }
        etag: { type: string, pattern: '^"[0-9]+"$' }
    IssueRequest:
      type: object
      additionalProperties: false
      required: [applicationId, quantity, startMode, term, features]
      properties:
        applicationId: { type: string, format: uuid }
        customerId: { type: [string, 'null'], format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        startMode: { type: string, enum: [OnIssue, OnActivation] }
        term: { $ref: '#/components/schemas/Term' }
        features:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
      description: Until permitido solo con OnIssue y fecha futura; features deben existir y estar activas en aplicación.
    IssueResponse:
      type: object
      required: [codesRecoverable, items]
      properties:
        codesRecoverable: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [license, licenseKey]
            properties:
              license: { $ref: '#/components/schemas/License' }
              licenseKey: { type: [string, 'null'], pattern: '^LH1_[A-Za-z0-9_-]{43}$' }
    RenewalRequest:
      type: object
      additionalProperties: false
      required: [operationId, term, reactivate, reason]
      properties:
        operationId: { type: string, format: uuid }
        term: { $ref: '#/components/schemas/Term' }
        reactivate: { type: boolean }
        paymentId: { type: [string, 'null'], format: uuid }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StateChange:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    Application:
      type: object
      required: [id, name, slug, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time, pattern: 'Z$' }
    Customer:
      type: object
      required: [id, applicationId, subjectId, displayName, email, createdAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        displayName: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        createdAt: { type: string, format: date-time, pattern: 'Z$' }
    Payment:
      type: object
      required: [id, applicationId, licenseId, customerId, amount, currency, state, reference, createdAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        licenseId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        amount: { type: string, pattern: '^[0-9]{1,15}\.[0-9]{4}$', description: Decimal exacto; mayor que cero. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        state: { type: string, enum: [Pending, Confirmed, Rejected, Refunded] }
        reference: { type: string, minLength: 1, maxLength: 120 }
        createdAt: { type: string, format: date-time, pattern: 'Z$' }
    Warning:
      type: object
      required: [id, code, severity, message, createdAt, licenseId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64, description: Extensible; expiry_approaching, expired, suspended, revoked. }
        severity: { type: string, enum: [Info, Warning, Error] }
        message: { type: string, maxLength: 1000, description: Texto plano; no HTML. }
        createdAt: { type: string, format: date-time, pattern: 'Z$' }
        licenseId: { type: string, format: uuid }
    AuditLog:
      type: object
      required: [id, applicationId, actorId, action, entityId, reason, createdAt, traceId]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        actorId: { type: string, maxLength: 128 }
        action: { type: string, maxLength: 100 }
        entityId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'], maxLength: 1000 }
        createdAt: { type: string, format: date-time, pattern: 'Z$' }
        traceId: { type: string, maxLength: 128 }
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Sin secretos, SQL ni stack trace. }
        instance: { type: string, format: uri-reference }
        code: { type: string, maxLength: 64, description: Código estable extensible; el SDK conserva valores desconocidos. }
        traceId: { type: string, maxLength: 128 }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
