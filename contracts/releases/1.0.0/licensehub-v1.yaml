components:
  securitySchemes:
    IntegrationCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque-application-credential
      description: 'Secreto opaco de backend: 32 bytes aleatorios codificados base64url sin padding (43 caracteres).
        Se almacena únicamente SHA-256. Aplicación y scopes se resuelven en servidor en cada solicitud, sin caché
        de autenticación. Credencial expirada, revocada o de aplicación inactiva devuelve 401; scope insuficiente
        devuelve 403. Solo Authorization Bearer; no se aceptan secretos en URL ni cookies. No es JWT.'
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-LicenseHub
      description: Sesión Identity MFA en producción, Secure HttpOnly SameSite Strict.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Antiforgery vinculado a sesión; obligatorio en mutaciones administrativas.
    MfaChallenge:
      type: apiKey
      in: cookie
      name: __Host-LicenseHubChallenge
      description: Cookie protegida de challenge MFA, HttpOnly Secure Strict; no concede permisos administrativos.
  parameters:
    SubjectId:
      name: subjectId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/SubjectId'
    ApplicationId:
      name: applicationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por cliente; reutilizar solo para mismo comando. Retención mínima 30 días.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag fuerte de versión de licencia; lista administrativa incluye etag. No se acepta asterisco.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Cursor opaco validado, ligado a aplicación y filtros; orden createdAt,id descendente.
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Solicitud inválida; validation_failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Credencial/sesión ausente, inválida, expirada o revocada; authentication_required.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Scope insuficiente, aplicación desactivada, MFA incompleto o CSRF inválido; forbidden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso no visible o clave no disponible; not_found o license_unavailable, sin revelar propietario.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'license_unavailable, invalid_transition, subject_already_licensed, payment_already_applied,
        operation_conflict, idempotency_conflict o idempotency_in_progress. Implementación: license_already_activated,
        license_not_activatable, license_subject_mismatch, subject_has_license, renewal_already_applied, invalid_transition
        o conflict.'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Solo para operación aún en curso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Versión cambió; concurrency_conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Falta If-Match; precondition_required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Límite excedido; rate_limited.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Dependencia temporalmente indisponible; service_unavailable. No conceder derechos nuevos.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Error inesperado; internal_error. Sin detalles internos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SubjectId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      description: Identificador estable case-sensitive de negocio/cuenta en aplicación; determinado por backend
