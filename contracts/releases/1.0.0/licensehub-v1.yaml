    EntitlementSnapshot:
      type: object
      required:
      - applicationId
      - subjectId
      - license
      - effectiveState
      - hasPremium
      - features
      - evaluatedAt
      - cacheUntil
      - entitlementVersion
      properties:
        applicationId:
          type: string
          format: uuid
