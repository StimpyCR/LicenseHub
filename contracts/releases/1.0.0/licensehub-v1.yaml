openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: LicenseHub API
  version: 1.0.0
  description: 'Contrato v1 revisado para LicenseHub.SDK. HTTPS obligatorio.

    Integraciones autenticadas por credencial opaca de backend; aplicación derivada

    de la credencial, nunca del cuerpo. subjectId lo determina el backend consumidor.

    Todas las respuestas incluyen Cache-Control no-store. Fechas UTC RFC3339.

    Idempotencia transaccional con retención mínima de 30 días; replay de activación

    devuelve resultado original y no sirve como autorización actual.

    Admin requiere sesión Identity con MFA y permiso por aplicación; mutaciones

    requieren X-CSRF-TOKEN. Recursos ajenos se responden como 404.


    Sesiones administrativas, licencias y derechos implementados; SDK en repositorio independiente.

    Solicitudes JSON sin propiedades duplicadas; activación admite solo licenseKey y subjectId.

    Las sondas /health son la única excepción HTTP para redes internas/locales; no aceptan secretos ni operaciones
    de negocio.'
servers:
- url: https://licensehub.example.invalid
tags:
- name: Integration
- name: Administration
- name: Operations
security:
- IntegrationCredential: []
paths:
  /api/v1/licenses/activate:
    post:
      tags:
      - Integration
      operationId: activateLicense
      description: 'Scope licenses:activate. Un único canje por clave. Repetir la misma clave

        idempotente y solicitud devuelve el resultado original; otro intento de

        canje devuelve 409. Cliente preasignado debe coincidir con subjectId.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: Activación confirmada o replay original.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/licenses/status:
    get:
      tags:
      - Integration
      operationId: getLicenseStatus
      description: Scope licenses:read. Sin licencia devuelve 200, license null y effectiveState None. Una sola
        licencia activa por sujeto; se prioriza Active/Suspended, luego el historial activado más reciente. Pending
        no concede derechos.
      parameters:
      - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Snapshot calculado al momento de consultar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/licenses/features:
    get:
      tags:
      - Integration
      operationId: getLicenseFeatures
      description: 'Scope licenses:read. Retorna el snapshot completo y solo features concedidas.

        Código ausente equivale a denegado. Aplicación o feature desactivada no concede derechos.

        '
      parameters:
      - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Derechos efectivos; lista vacía si no hay Premium.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/licenses/warnings:
    get:
      tags:
      - Integration
      operationId: getLicenseWarnings
      description: Scope warnings:read. Solo avisos del sujeto dentro de la aplicación autenticada. Solo avisos
        InApp vencidos para entrega y de la versión actual de derechos; mensajes de texto plano. Las alertas anteriores
        a la renovación quedan obsoletas.
      parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Orden estable por createdAt e id; cursor opaco ligado a aplicación, sujeto y filtros.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warning'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/licenses:
    post:
      tags:
      - Administration
      operationId: issueLicenses
      security:
      - AdminSession: []
        CsrfToken: []
      description: "Permiso licenses:issue. Devuelve códigos completos solo en la respuesta de creación.\nUn replay\
        \ devuelve códigos null y codesRecoverable false; no se guardan secretos\nen idempotencia. Cantidad de 1\
        \ a 100, operación atómica.\n Pending hasta canje, incluso OnIssue; OnIssue inicia el reloj inmediatamente.\
        \ Un cliente preasignado no puede recibir un lote mayor de uno."
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          description: Licencias emitidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '200':
          description: Replay sin códigos recuperables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - Administration
      operationId: listLicenses
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: state
        in: query
        schema:
          $ref: '#/components/schemas/LicenseState'
      - name: customerId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Licencias sin códigos ni hashes.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/License'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Permiso licenses:read. Cursor firmado ligado a aplicación y filtros; estado efectivo calculado
        en UTC.
  /api/v1/admin/licenses/{id}/renew:
    post:
      tags:
      - Administration
      operationId: renewLicense
      security:
      - AdminSession: []
        CsrfToken: []
      description: Permiso licenses:renew; reactivate requiere licenses:reactivate. operationId es único permanente
        por aplicación. Solo licencias canjeadas. Este comando es renovación manual; pagos con intención de renovación
        se aplican atómicamente en confirmPayment, nunca mediante este endpoint. operationId repetido con otra Idempotency-Key
        devuelve 409 sin extensión adicional; replay de la misma clave conserva resultado original.
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewalRequest'
      responses:
        '200':
          description: Licencia renovada; replay se resuelve antes de comprobar If-Match otra vez.
          headers:
            ETag:
              schema:
                type: string
              description: Versión fuerte de la licencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/licenses/{id}/suspend:
    post:
      tags:
      - Administration
      operationId: suspendLicense
      security:
      - AdminSession: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChange'
      responses:
        '200':
          description: Suspendida; derechos invalidados en servidor, caché SDK hasta 30 segundos.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Permiso licenses:suspend. Motivo obligatorio y transición comprobada; Cancelled terminal. Propagación
        de caché hasta 30 segundos.
  /api/v1/admin/licenses/{id}/revoke:
    post:
      tags:
      - Administration
      operationId: revokeLicense
      security:
      - AdminSession: []
        CsrfToken: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChange'
      responses:
        '200':
          description: Revocada, propagación de caché igual a suspensión.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Permiso licenses:revoke. Motivo obligatorio y transición comprobada; Cancelled terminal. Propagación
        de caché hasta 30 segundos.
  /api/v1/admin/applications:
    get:
      tags:
      - Administration
      operationId: listApplications
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Solo aplicaciones autorizadas.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Administration
      operationId: createApplication
      description: SuperAdmin; slug único inmutable. Reintentos con la misma Idempotency-Key y cuerpo devuelven
        el resultado original; otro cuerpo devuelve 409.
      security:
      - AdminSession: []
        CsrfToken: []
      responses:
        '201':
          description: Operación completada. SuperAdmin; slug único inmutable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationWrite'
  /api/v1/admin/customers:
    get:
      tags:
      - Administration
      operationId: listCustomers
      description: Búsqueda parcial literal sin distinguir mayúsculas en subjectId, nombre o correo. query máximo 120 caracteres; cursor vinculado al filtro.
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: query
        in: query
        schema:
          type: string
          maxLength: 120
      responses:
        '200':
          description: Clientes de aplicación autorizada.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Permiso customers:read. Cursor firmado ligado a aplicación y filtros; subjectId pertenece al
        backend consumidor.
    post:
      tags:
      - Administration
      operationId: createCustomer
      description: Permiso customers:manage; subjectId único dentro de aplicación.
      security:
      - AdminSession: []
        CsrfToken: []
      responses:
        '201':
          description: Operación completada. Permiso customers:manage; subjectId único dentro de aplicación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
  /api/v1/admin/payments:
    get:
      tags:
      - Administration
      operationId: listPayments
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Pagos de aplicación autorizada.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Permiso payments:read. Importes decimales exactos, cursor protegido ligado a aplicación/filtros.
    post:
      tags:
      - Administration
      operationId: createPayment
      description: Permiso payments:record; Pending. FK licencia/cliente/aplicación deben coincidir. Moneda ISO4217,
        amount > 0. No datos de tarjeta. Registro manual Pending; no mueve dinero ni cobra. Confirmación con renovación
        requiere permiso explícito de reactivación si la intención lo solicita.
      security:
      - AdminSession: []
        CsrfToken: []
      responses:
        '201':
          description: Operación completada. Permiso payments:record; Pending. FK licencia/cliente/aplicación deben
            coincidir. Moneda ISO4217, amount > 0. No datos de tarjeta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWrite'
  /api/v1/admin/audit-logs:
    get:
      tags:
      - Administration
      operationId: listAuditLogs
      description: Permiso audit:read; applicationId obligatorio. Excluye auditoría global. Filtro action exacto, máximo 100 caracteres.
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: action
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
      responses:
        '200':
          description: Auditoría de aplicación autorizada.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/applications/{id}:
    put:
      tags:
      - Administration
      operationId: updateApplication
      description: SuperAdmin; desactivar invalida integración. slug debe coincidir con el existente; no se cambia
        identidad.
      security:
      - AdminSession: []
        CsrfToken: []
      responses:
        '200':
          description: Operación completada. SuperAdmin; desactivar invalida integración. slug debe coincidir con
            el existente; no se cambia identidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationWrite'
  /api/v1/admin/applications/{id}/credentials:
    get:
      tags:
      - Administration
      operationId: listCredentials
      description: SuperAdmin o permiso credentials:read; nunca hashes ni secretos.
      security:
      - AdminSession: []
      responses:
        '200':
          description: Operación completada. SuperAdmin o permiso credentials:read; nunca hashes ni secretos.
          content:
            application/json:
