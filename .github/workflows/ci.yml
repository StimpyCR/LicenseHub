name: LicenseHub CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: licensehub_tests
          POSTGRES_USER: licensehub_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U licensehub_test -d licensehub_tests"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LICENSEHUB_TEST_CONNECTION: Host=127.0.0.1;Database=licensehub_tests;Username=licensehub_test;Password=${{ github.run_id }}-${{ github.run_attempt }}
      LICENSEHUB_CONTRACT_RESULTS_DIR: ${{ github.workspace }}/.tooling/contract-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore backend/LicenseHub.slnx --locked-mode
      - run: dotnet build backend/LicenseHub.slnx -c Release --no-restore
      - run: dotnet format backend/LicenseHub.slnx --verify-no-changes --no-restore
      - run: dotnet test backend/LicenseHub.slnx -c Release --no-build --no-restore
      - run: dotnet package list --project backend/LicenseHub.slnx --vulnerable --include-transitive --format json > nuget-audit.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check-nuget-audit.py nuget-audit.json
      - run: python -m pip install -r contracts/requirements-validation.txt
      - run: python contracts/validate_http_results.py .tooling/contract-results
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/licensehub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/licensehub-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=low
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contracts/requirements-validation.txt
      - run: python contracts/validate_contract.py
      - run: python contracts/check_compatibility.py
# No hay job de despliegue; producción requiere autorización expresa.
