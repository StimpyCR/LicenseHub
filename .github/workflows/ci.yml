name: LicenseHub CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
        env:
          MP_DISABLE_VERSION_CHECK: "true"
          MP_SMTP_DISABLE_RDNS: "true"
          MP_ALLOWED_HOSTS: localhost,127.0.0.1
        ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
        options: >-
          --user 65532:65532 --read-only --tmpfs /tmp:mode=1777
          --cap-drop ALL --security-opt no-new-privileges
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: licensehub_tests
          POSTGRES_USER: licensehub_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U licensehub_test -d licensehub_tests"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LICENSEHUB_MAILPIT_TESTS: "1"
      LICENSEHUB_MAILPIT_HOST: "127.0.0.1"
      LICENSEHUB_MAILPIT_URL: http://127.0.0.1:8025
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      LICENSEHUB_TEST_CONNECTION: Host=127.0.0.1;Database=licensehub_tests;Username=licensehub_test;Password=${{ github.run_id }}-${{ github.run_attempt }}
      LICENSEHUB_CONTRACT_RESULTS_DIR: ${{ github.workspace }}/.tooling/contract-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore backend/LicenseHub.slnx --locked-mode -p:NuGetAudit=false
      - run: dotnet build backend/LicenseHub.slnx -c Release --no-restore
      - run: dotnet format backend/LicenseHub.slnx --verify-no-changes --no-restore
      - run: dotnet test backend/LicenseHub.slnx -c Release --no-build --no-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contracts/requirements-validation.txt
      - run: python contracts/validate_http_results.py .tooling/contract-results
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/licensehub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/licensehub-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
  dependencies-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public scanner and vulnerability database only
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/licensehub-lockfiles"
          sudo chown 65532:65532 "$RUNNER_TEMP/trivy-cache"
          docker pull aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          docker run --rm --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/cache" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --cache-dir /cache --download-db-only --disable-telemetry --skip-version-check --quiet
          git ls-files -z '*packages.lock.json' 'frontend/licensehub-web/package-lock.json' | while IFS= read -r -d '' file; do
            install -D "$file" "$RUNNER_TEMP/licensehub-lockfiles/$file"
          done
      - name: Scan lockfiles with network disabled and no telemetry
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 65532:65532 --tmpfs /tmp:mode=1777 --mount "type=bind,source=$RUNNER_TEMP/licensehub-lockfiles,target=/input,readonly" --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/cache,readonly" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa fs --cache-dir /cache --cache-backend memory --offline-scan --skip-db-update --skip-java-db-update --skip-check-update --skip-vex-repo-update --disable-telemetry --skip-version-check --scanners vuln --include-dev-deps --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 /input
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contracts/requirements-validation.txt
      - run: python contracts/validate_contract.py
      - run: python contracts/check_compatibility.py
# No hay job de despliegue; producción requiere autorización expresa.
