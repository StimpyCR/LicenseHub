# Solo entorno local ya restaurado y validado. No crea ni elimina PostgreSQL.
name: licensehub-local-next
services:
  api-next:
    image: ${LICENSEHUB_LOCAL_API_IMAGE:?Imagen local conservada}
    pull_policy: never
    user: "1654:1654"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LicenseHubFile: /run/secrets/db_connection
      DataProtection__KeyPath: /app/.keys
      TrustedProxies__0: 172.29.87.11
      Jobs__Enabled: ${LICENSEHUB_LOCAL_JOBS_ENABLED:-false}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__From: notifications@licensehub.example.invalid
      Smtp__AllowUnencryptedDevelopment: "true"
    secrets: [db_connection]
    volumes: [data-protection:/app/.keys]
    networks: [private, mailcapture]
  web-next:
    image: ${LICENSEHUB_LOCAL_WEB_IMAGE:?Imagen local conservada}
    pull_policy: never
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ${LICENSEHUB_LOCAL_NGINX_FILE:?Configuración local}:/etc/nginx/conf.d/default.conf:ro
    secrets: [tls_certificate, tls_key]
    ports: ["127.0.0.1:8443:8443"]
    depends_on: [api-next]
    networks:
      private: { ipv4_address: 172.29.87.11 }
secrets:
  db_connection:
    file: ${LICENSEHUB_LOCAL_CONNECTION_FILE:?Conexión privada}
  tls_certificate:
    file: ../.secrets/compose/localhost.pem
  tls_key:
    file: ../.secrets/compose/localhost.key
volumes:
  data-protection:
    external: true
    name: licensehub-local_data-protection
networks:
  private:
    external: true
    name: licensehub-local_private
  mailcapture:
    external: true
    name: licensehub-local_mailcapture
