# Plantilla independiente: no combina ni altera licensehub-local.
# Las imágenes deben ser digests verificados por el operador.
name: licensehub-production
services:
  api:
    image: ${LICENSEHUB_API_IMAGE:?Define imagen API aprobada con digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${LICENSEHUB_PUBLIC_HOST:?Define dominio real}
      ConnectionStrings__LicenseHubFile: /run/secrets/db_connection
      DataProtection__KeyPath: /app/.keys
      DataProtection__CertificatePath: /run/secrets/data_protection_certificate
      DataProtection__CertificatePasswordFile: /run/secrets/data_protection_password
      TrustedProxies__0: 172.29.88.10
      Jobs__Enabled: "true"
    secrets: [db_connection, data_protection_certificate, data_protection_password]
    volumes: [data-protection:/app/.keys]
    networks: [private]
  web:
    image: ${LICENSEHUB_WEB_IMAGE:?Define imagen web aprobada con digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, "/etc/nginx/conf.d:mode=1777"]
    environment:
      LICENSEHUB_PUBLIC_HOST: ${LICENSEHUB_PUBLIC_HOST:?Define dominio real}
    ports: ["${LICENSEHUB_LISTEN_ADDRESS:-127.0.0.1}:8443:8443"]
    secrets: [tls_certificate, tls_key]
    volumes:
      - ./nginx.production.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      private: { ipv4_address: 172.29.88.10 }
secrets:
  db_connection:
    file: ${LICENSEHUB_DB_CONNECTION_FILE:?Define conexión runtime de mínimo privilegio}
  data_protection_certificate:
    file: ${LICENSEHUB_DP_CERTIFICATE_FILE:?Define PFX privado DataProtection}
  data_protection_password:
    file: ${LICENSEHUB_DP_PASSWORD_FILE:?Define contraseña privada PFX}
  tls_certificate:
    file: ${LICENSEHUB_TLS_CERTIFICATE_FILE:?Define certificado TLS}
  tls_key:
    file: ${LICENSEHUB_TLS_KEY_FILE:?Define clave privada TLS}
volumes:
  data-protection:
networks:
  private:
    ipam:
      config: [{ subnet: 172.29.88.0/24 }]
